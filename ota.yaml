version: 1
metadata:
  ota:
    minimum_version: "1.6.25"
project:
  name: nopCommerce
  description: nopCommerce readiness slice covering .NET restore, build, and test for Nop.Tests project
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: mcr.microsoft.com/dotnet/sdk:10.0
        engines:
          - docker
          - podman
toolchains:
  dotnet:
    version: '10.0'
    fulfillment:
      source: dotnet
      mode: run
tasks:
  build:
    context: host
    category: build
    description: Build the Nop.Tests project.
    command:
      exe: dotnet
      args:
        - build
        - --no-restore
        - src/Tests/Nop.Tests/Nop.Tests.csproj
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: dotnet
            args:
              - build
              - --no-restore
              - src/Tests/Nop.Tests/Nop.Tests.csproj
        container:
          context: app
          command:
            exe: dotnet
            args:
              - build
              - --no-restore
              - src/Tests/Nop.Tests/Nop.Tests.csproj
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
    safe_for_agent: true
    notes: Build the selected test project for this contract slice.
  setup:
    context: host
    category: setup
    description: Restore dependencies for the Nop.Tests project.
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: dotnet_restore
        cwd: src/Tests/Nop.Tests
    execution:
      default_mode: native
      modes:
        native:
          context: host
        container:
          context: app
    requirements:
      toolchains:
        - dotnet
    effects:
      network: true
      network_kind: dependency_hydration
    safe_for_agent: true
    notes: Restore dependencies for the selected test project.
    internal: true
  test:
    context: host
    category: dev
    description: Run the full Nop.Tests project.
    command:
      exe: dotnet
      args:
        - test
        - --no-restore
        - --verbosity
        - minimal
        - src/Tests/Nop.Tests/Nop.Tests.csproj
    execution:
      default_mode: native
      modes:
        native:
          context: host
          command:
            exe: dotnet
            args:
              - test
              - --no-restore
              - --verbosity
              - minimal
              - src/Tests/Nop.Tests/Nop.Tests.csproj
        container:
          context: app
          command:
            exe: dotnet
            args:
              - test
              - --no-restore
              - --verbosity
              - minimal
              - src/Tests/Nop.Tests/Nop.Tests.csproj
    depends_on:
      - setup
    requirements:
      toolchains:
        - dotnet
    notes: Run the selected test project for this contract slice.
  verify:
    category: test
    description: Aggregate baseline nopCommerce verification checks.
    aggregate:
      tasks:
        - build
    safe_for_agent: true
    notes: Contract-level verification path using deterministic build-only baseline.
workflows:
  default: verify
  verify:
    description: Canonical nopCommerce verification path for this contract slice.
    setup:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared setup plus baseline verification sequence.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
  - verify
  verify_after_changes:
  - verify
  writable_paths:
  - src/Build
  - src/Libraries
  - src/Plugins
  - src/Presentation
  - src/Tests
  protected_paths:
  - .github/workflows
  - global.json
  - docker-compose.yml
  - src/Presentation/Nop.Web/package-lock.json
  - ota.yaml
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:nested_project_root
      protected_paths:
      - init:contract_file_default
  bootstrap:
    ota:
      source:
        kind: version
        version: v1.6.25
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
