version: 1
metadata:
  ota:
    minimum_version: "1.6.18"
project:
  name: nopCommerce
  description: nopCommerce readiness slice covering .NET restore, build, and test for Nop.Tests project
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: ephemeral
      container:
        image: mcr.microsoft.com/dotnet/sdk:10.0
        engines:
          - docker
          - podman
runtimes:
  dotnet: '10.0'
tools:
  dotnet: '*'
checks:
- name: dotnet-installed
  kind: precondition
  severity: error
  run: dotnet --version
tasks:
  build:
    context: host
    category: build
    description: Build the Nop.Tests project.
    run: dotnet build --no-restore src/Tests/Nop.Tests/Nop.Tests.csproj
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: dotnet build --no-restore src/Tests/Nop.Tests/Nop.Tests.csproj
        container:
          context: app
          run: dotnet build --no-restore src/Tests/Nop.Tests/Nop.Tests.csproj
    depends_on:
      - setup
    notes: Build the selected test project for this contract slice.
  setup:
    context: host
    category: setup
    description: Restore dependencies for the Nop.Tests project.
    run: dotnet restore --disable-parallel src/Tests/Nop.Tests/Nop.Tests.csproj
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: dotnet restore --disable-parallel src/Tests/Nop.Tests/Nop.Tests.csproj
        container:
          context: app
          run: dotnet restore --disable-parallel src/Tests/Nop.Tests/Nop.Tests.csproj
    effects:
      network: true
      network_kind: dependency_hydration
    notes: Restore dependencies for the selected test project.
    internal: true
  test:
    context: host
    category: test
    description: Run the Nop.Tests project.
    run: dotnet test --no-restore --verbosity minimal src/Tests/Nop.Tests/Nop.Tests.csproj
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: dotnet test --no-restore --verbosity minimal src/Tests/Nop.Tests/Nop.Tests.csproj
        container:
          context: app
          run: dotnet test --no-restore --verbosity minimal src/Tests/Nop.Tests/Nop.Tests.csproj
    depends_on:
      - setup
    safe_for_agent: true
    notes: Run the selected test project for this contract slice.
  verify:
    context: host
    category: test
    description: Aggregate baseline nopCommerce verification checks.
    run: "true"
    execution:
      default_mode: native
      modes:
        native:
          context: host
          run: "true"
        container:
          context: app
          run: "true"
    depends_on:
      - build
      - test
    safe_for_agent: true
    notes: Contract-level verification path.
workflows:
  default: verify
  verify:
    description: Canonical nopCommerce verification path for this contract slice.
    setup:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` to run the declared setup plus baseline verification sequence.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  safe_tasks:
  - test
  - verify
  verify_after_changes:
  - verify
  writable_paths:
  - src/Build
  - src/Libraries
  - src/Plugins
  - src/Presentation
  - src/Tests
  protected_paths:
  - .github/workflows
  - global.json
  - docker-compose.yml
  - src/Presentation/Nop.Web/package-lock.json
  - ota.yaml
  inferred_boundary:
    reviewed: true
    provenance:
      writable_paths:
      - init:nested_project_root
      protected_paths:
      - init:contract_file_default
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.18 sh
      powershell: $env:OTA_VERSION='v1.6.18'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use `ota workflows` to inspect declared workflow paths.
    Use `ota up --workflow verify` when you want setup and verification through one declared path.
    Use `ota tasks --safe --use` to inspect the approved agent task surface before execution.
    Use `ota validate` before changes and `ota doctor` after edits.
    Use `ota run verify` for the contract verification path.
